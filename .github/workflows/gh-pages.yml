name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: |
          cd EnergyPulse/EnergyPulse.UI
          dotnet publish -c Release -p:GHPages=true -o publish

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: EnergyPulse/EnergyPulse.UI/publish/wwwroot
          publish_branch: gh-pages
          destination_dir: ./
