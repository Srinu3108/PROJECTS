<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergyPulse - Energy Monitoring System</title>
    <base href="/PROJECTS/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // File download helper function - decodes Base64 and downloads
        window.downloadFile = function(filename, base64Content, fileType) {
            fileType = fileType || 'text/plain';

            try {
                // Decode Base64 string to binary
                const binaryString = atob(base64Content);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // Create Blob from decoded bytes
                const blob = new Blob([bytes], { type: fileType + ';charset=utf-8;' });
                const link = document.createElement('a');

                if (navigator.msSaveBlob) { // IE 10+
                    navigator.msSaveBlob(blob, filename);
                } else {
                    const url = URL.createObjectURL(blob);
                    link.href = url;
                    link.download = filename;
                    link.style.display = 'none';

                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // Clean up the URL object
                    setTimeout(() => URL.revokeObjectURL(url), 100);
                }

                console.log('File downloaded: ' + filename);
            } catch (error) {
                console.error('Download error:', error);
                alert('Failed to download file. Please try again.');
            }
        };
    </script>
</body>

</html>

<style>
    .b-bar {
        display: none !important;
    }
</style>
